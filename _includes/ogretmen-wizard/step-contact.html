<div class="ogretmen-wizard__panel" data-step="4" id="ow-step-4">
  <h2 class="h4 mb-3">4. İletişim bilgileri</h2>
  <form class="ogretmen-wizard__form" id="ow-contact-form" novalidate>
    <div class="row g-3">
      <div class="col-md-6">
        <label class="form-label" for="ow-first-name">Ad *</label>
        <input class="form-control" type="text" id="ow-first-name" required autocomplete="given-name">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ow-last-name">Soyad *</label>
        <input class="form-control" type="text" id="ow-last-name" required autocomplete="family-name">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ow-city">İl *</label>
        <input class="form-control" type="text" id="ow-city" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ow-district">İlçe *</label>
        <input class="form-control" type="text" id="ow-district" required>
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ow-phone">Telefon *</label>
        <input class="form-control" type="tel" id="ow-phone" required autocomplete="tel">
      </div>
      <div class="col-md-6">
        <label class="form-label" for="ow-email">E-posta *</label>
        <input class="form-control" type="email" id="ow-email" required autocomplete="email">
      </div>
      <div class="col-12">
        <label class="form-label" for="ow-school">Okul adı *</label>
        <input class="form-control" type="text" id="ow-school" required>
      </div>
    </div>
  </form>
</div>
