contact_address: "Alemdar Mh. Prof. Kazım İsmail Gürkan Cad. No:8 Fatih, 34110 İstanbul"

# Form endpoints (Google Apps Script / Forms embed — Workspace'te oluşturulur)
ogretmen_submit_url: "https://script.google.com/macros/s/AKfycbwvDFx-F4z2K8cKtX2oCVtbckdgjIh9LMMrDZbvWVNrgCV2CYdjqTiUpjXQoHMUAmjC/exec"
# Google reCAPTCHA v2 — https://www.google.com/recaptcha/admin (damlaokul.com + localhost)
ogretmen_recaptcha_site_key: "6LfsHJAtAAAAAG_j7xRL46_TXnDKfA4a7PARcltD"
teklif_form_url: ""

# behold.so instagram carousel
instagram_carousel:
  username: okul.damla
  profile_url: https://instagram.com/okul.damla
  feed_url: 'https://feeds.behold.so/k4ylFSaGtUBY15ZsyXAt'
  limit: 12


include: ["_pages"]
permalink: /:title/

# Plugins
plugins: 
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-gist
 
# Defaults
defaults:

  # all posts
  - scope:
      path: "_posts"
    values:
      layout: post
      avatar: /assets/images/avatar.jpg
      
  # all pages
  - scope:
      path: "_pages"
    values:
      layout: page

  # all books
  - scope:
      type: "books"
      path: "_books"
    values:
      layout: book
      type: product
      lang: tr
      image: assets/images/logo.png
      sitemap:
        priority: 0.8
        changefreq: monthly

  # all catalogs
  - scope:
      type: "catalogs"
      path: "_catalogs"
    values:
      layout: catalog

  # all slides
  - scope:
      type: "slides"
      path: "_slides"
    values:
      author: "Anonymous"
      
# Syntax
markdown: kramdown
highlighter: rouge

# XML feed
feed:
  collections:
    books:
      path: "/urunler/feed.xml"
    catalogs:
      path: "/kataloglar/feed.xml"

# excerpt
excerpt_separator: <!--more-->


# Adsense (change to "enabled" to activate, also your client id and ad slot. Create a new ad unit from your Adsense account to get the slot.)
adsense: "disabled"
adsense-data-ad-client: "ca-pub-3412143450191416"
adsense-data-ad-slot: "1363087678"

# Lazy Images ("enabled" or "disabled")
lazyimages: "enabled"

# HDS sınav PDF bağlantıları (true: kitaplarda examlink doluysa HDS butonu görünür; false: hiçbir yerde gösterilmez)
examlink: false

collections:
  books:
    output: true
    permalink: /urunler/:title
    # sort_by: 
  catalogs:
    output: true
    permalink: /kataloglar/:title
  slides: 
    output: false
    sort_by: order

# Exclude metadata, gitignored local data, and development dependencies
exclude:
  - README.markdown
  - package.json
  - grunt.js
  - Gruntfile.js
  - Gruntfile.coffee
  - node_modules
  - .cursor
  - docs
