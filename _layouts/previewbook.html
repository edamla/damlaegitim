---
layout: default
---
<style>
  iframe {
    border: 0;
  }
  .Grid {
    display: flex;
    flex-wrap: wrap;
    height: 100%;
  }
  .Grid-cell {
    flex: 3;
    height: 100%;
  }
  .Demo {
    background: #212121;
    transition: background-color 0.3s ease;
    height: 100vh;
  }
</style>

{% assign book = page %}

<div class="container-lg pt-4 pb-2">
  <article class="article-post">
    {% include book-minimal-content.html %}
  </article>
  {% include related-books.html %}
</div>

<div class="Grid-cell">
  <div class="Demo content">
    {% if book.preview_link != nil and book.preview_link != '' %}
    <iframe id="iframe" src="{{ book.preview_link }}" name="fbook" width="100%" height="100%" title="{{ book.title }} — ön okuma"></iframe>
    {% else %}
    <p class="p-4 text-muted">Ön izleme şu anda kullanılamıyor.</p>
    {% endif %}
  </div>
</div>

{% include structured-data-book.html %}
